name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths-ignore:
      - '.gemini/**'
      - '*.md'
  # Permet de relancer une construction depuis l'onglet Actions sans avoir à
  # produire un commit vide.
  workflow_dispatch:

concurrency:
  group: docker-build
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: 'true'

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: 'file:./dev.db'

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Set lowercase image name
        run: echo "IMAGE_LOWER=$(echo ${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_LOWER }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_LOWER }}:${{ github.sha }}

      - name: Trigger Portainer redeploy
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            curl -s -X POST "$WEBHOOK_URL"
          fi
