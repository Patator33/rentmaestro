services:
  rentmaestro:
    image: ghcr.io/patator33/rentmaestro:latest
    ports:
      - "${PORT_EXTERNAL:-3008}:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/data/rentmaestro.db
      # Email Configuration (Gmail)
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM:-}
      # URL externe de l'application (pour les liens dans les emails)
      - APP_BASE_URL=${APP_BASE_URL:-https://rentmaestro.nico33.net}
      # Automations & Webhooks
      # `:?message` fait échouer `docker compose up` si la variable est absente
      # ou vide : aucun secret par défaut n'est embarqué dans l'image.
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET doit être défini (secret aléatoire)}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://n8n.votredomaine.com/webhook/rentmaestro}
      # Rapprochement automatique des virements bancaires. Optionnels : laissés
      # vides, les routes /api/automation et le webhook Telegram restent fermés.
      #   AUTOMATION_SECRET      : partagé avec n8n (en-tête x-automation-secret)
      #   TELEGRAM_WEBHOOK_SECRET: renvoyé par Telegram à chaque clic sur un bouton
      # 16 caractères minimum chacun, différents l'un de l'autre.
      - AUTOMATION_SECRET=${AUTOMATION_SECRET:-}
      - TELEGRAM_WEBHOOK_SECRET=${TELEGRAM_WEBHOOK_SECRET:-}
      # Session secret for iron-session — générer avec :
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - SESSION_SECRET=${SESSION_SECRET:?SESSION_SECRET doit être défini (>= 32 caractères aléatoires)}
      # Set to 'true' if served over HTTPS (reverse proxy with TLS) — required for PWA install on Android
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      # Push notifications (VAPID keys — générer avec :
      #   node -e "console.log(require('web-push').generateVAPIDKeys())" )
      # La clé privée est un SECRET : ne jamais la committer, la fournir via .env
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:?VAPID_PUBLIC_KEY doit être défini}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:?VAPID_PRIVATE_KEY doit être défini (secret)}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-https://rentmaestro.nico33.net}
    volumes:
      - rentmaestro_data:/app/data
      - rentmaestro_uploads:/app/public/uploads
      - /data/rentmaestro:/app/data/save
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:3000 || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

volumes:
  rentmaestro_data:
  rentmaestro_uploads:
